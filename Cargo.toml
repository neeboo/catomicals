[workspace]
members = [
    "apps/catomicals-cli",
    "crates/issuance",
    "crates/node-client",
    "crates/secret-store",
    "crates/threshold-signer",
    "crates/trading",
    "crates/wallet-core",
    "crates/wallet-storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/catomicals/catomicals"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bitcoincore-rpc = "0.19"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"], default-features = false }
hex = "0.4"
frost-secp256k1-tr = "2.2"
fs2 = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rmcp = { version = "3.1.4", features = ["client", "server", "transport-io"] }
schemars = "1.0"
secp256k1 = { version = "0.29", features = ["rand-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.20"
tiny_http = "0.12"
tokio = { version = "1.47", features = ["io-std", "macros", "rt-multi-thread", "time"] }
url = "2.5"
uuid = { version = "1.16", features = ["v4", "serde"] }
webauthn-rs = "0.5.5"
webauthn-rs-proto = "0.5.5"
zeroize = "1.8"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
