# Catomicals development profile: Bitcoin Inquisition default Signet only.
# Copy deliberately; do not merge this file into a mainnet profile.

signet=1
server=1
daemon=0
listen=1

# Typed prevout and transaction-status checks require a complete transaction
# index. The wallet closes signing and broadcast paths until this index is
# synchronized to the active chain tip.
txindex=1

# Network-specific options must live under the Signet section on current
# Bitcoin Inquisition releases.
[signet]

# Cookie authentication is created automatically under signet/.cookie.
# RPC is limited to this host and must never be exposed on a public interface.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=38332

# Relay covenant transactions to peers running Bitcoin Inquisition.
addnode=inquisition.bitcoin-signet.net
